# =====================================================================
# Production stack: PostgreSQL + Go backend + Nuxt frontend + Nginx.
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#
# Services exposed externally:
#   - http://<host>/        → Nginx → Nuxt (SSR) on :3000
#   - http://<host>/api     → Nginx → Go backend on :8080
#   - http://<host>/ws      → Nginx → Go backend (WebSocket)
#   - http://<host>/uploads → Nginx → Go backend (static files)
#
# Postgres is INTERNAL only by default. To expose for `psql` debugging,
# uncomment the `ports:` block under `postgres`.
# =====================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crm_password}
      POSTGRES_DB: ${DB_NAME:-crm_real}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "127.0.0.1:5432:5432"   # uncomment for local psql access only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm} -d ${DB_NAME:-crm_real}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [crm-net]

  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    image: crm-real/backend:latest
    container_name: crm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-crm}
      DB_PASSWORD: ${DB_PASSWORD:-crm_password}
      DB_NAME: ${DB_NAME:-crm_real}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Главный Администратор}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [crm-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: crm-real/frontend:latest
    container_name: crm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-/}
      NUXT_PUBLIC_WS_BASE: ${PUBLIC_WS_BASE:-/}
    networks: [crm-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: crm-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/var/www/uploads:ro
    networks: [crm-net]

volumes:
  postgres_data:
  uploads_data:

networks:
  crm-net:
    driver: bridge
